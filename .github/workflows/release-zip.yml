name: Release zip

# Releaseを公開したときに、スキルのzipを作ってそのReleaseに添付する。
# claude.aiなどのアプリのスキルのアップロードに使う。手で作ると、余計なファイルの混入が起きるため
on:
  release:
    types: [published]
  # 既存のReleaseに添付し直すとき。タグ名を渡す
  workflow_dispatch:
    inputs:
      tag:
        description: "zipを添付するReleaseのタグ（例：v0.1.0）"
        required: true

permissions: {}

jobs:
  zip:
    runs-on: ubuntu-latest
    permissions:
      # Releaseへの添付に使う
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      # __pycache__ はスクリプトを手元で動かしたときにできるもので、スキルには要らないため除く
      - name: スキルのzipを作る
        working-directory: skills
        run: zip -r -X "$RUNNER_TEMP/paper-analysis-$TAG.zip" paper-analysis -x '*/__pycache__/*' '*.pyc' '*/.DS_Store'
      - name: zipの中身を確かめる
        run: |
          unzip -l "$RUNNER_TEMP/paper-analysis-$TAG.zip"
          unzip -l "$RUNNER_TEMP/paper-analysis-$TAG.zip" | grep -q ' paper-analysis/SKILL.md$'
      - name: Releaseに添付する
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/paper-analysis-$TAG.zip" --clobber --repo "$GITHUB_REPOSITORY"
